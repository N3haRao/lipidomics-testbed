# config.yaml: every path and parameter for the pipeline lives here.
# The scripts never hard-code any of this, so to run on another machine you copy this file
# and change the `paths:` block. Paths can contain spaces, they are handled with pathlib.
#
# `null` usually means "work it out from the data or from an earlier phase". The log of
# each phase says what value it ended up using.

project:
  name: "CLN3_MALDI_MSI"
  mutant_label: "CLN3 KO"            # how the Mutant group is called in figures and tables
  control_label: "Control"
  genotypes: {control: "Control", mutant: "Mutant"}   # values used in the sample sheet

paths:
  # The folder that CONTAINS "imzML files for biostats". On the shared drive it's called
  # "BRAIN - PILAR - SPATIAL". Examples (pick the one for the machine you run on):
  #   Mac, copied to the Desktop:   "/Users/neharao/Desktop/BRAIN - PILAR - SPATIAL"
  #   Mac, straight from the drive: "/Volumes/<drive name>/BRAIN - PILAR - SPATIAL"
  #   Windows:                      "D:/BRAIN - PILAR - SPATIAL"   (forward slashes are fine)
  # Only the imzML subfolder is read (plus the SCiLS exports if scils_crosscheck is on).
  # Nothing is ever written here. Keep the exact upper case: the Mac doesn't care, a Linux/HPC
  # filesystem does.
  data_root: "/Users/neharao/Desktop/BRAIN - PILAR - SPATIAL"
  imzml_subdir: "imzML files for biostats"
  output_root: "/Users/neharao/cln3_msi_outputs"      # everything the pipeline writes goes here
  cache_root: null                   # null means <output_root>/cache (LIPID MAPS, HMDB, atlas)
  sample_sheet: "metadata/sample_sheet.csv"           # relative paths are relative to the repo

modes:
  run: [lip_neg, lip_pos, met_neg]   # which modes phases 03 to 10 loop over
  definitions:
    lip_neg: {folder: "Lipid Negative",      polarity: negative, analyte: lipid,      expected_mz: [300, 2000]}
    lip_pos: {folder: "Lipid Positive",      polarity: positive, analyte: lipid,      expected_mz: [300, 2000]}
    met_neg: {folder: "Metabolite Negative", polarity: negative, analyte: metabolite, expected_mz: [50, 750]}
  file_regex: '^slide_(?P<slide>[a-z])_(?P<analyte>lip|met)_(?P<pol>neg|pos)\.imzML$'

acquisition:                         # what we were told. pixel_size_um and matrix_formula are used;
                                     # the rest is for the record (and to flag header mismatches).
  pixel_size_um: 50
  section_thickness_um: 10
  matrix: "DAN"
  matrix_formula: "C10H10N2"         # 1,5-diaminonaphthalene
  bregma_mm: [-1.58, -2.18]
  # Instrument, inferred from the Bruker method files Pilar shared for a later cerebellum run
  # (09SEP26/.../microTOFQImpacTemAcquisition.method, analysis.tdf): a Bruker timsTOF (fleX),
  # i.e. a QTOF. Not confirmed for slides E-K; 01/02 log what the imzML headers and the peak
  # widths actually say.
  instrument_expected: "Bruker timsTOF fleX (QTOF), to confirm"

runtime:
  spectra_chunk: 2000                # spectra read per batch when streaming an .ibd
  log_memory_every: 10000            # write a memory line to the log every N spectra
  seed: 0

qc:
  slide: "E"                         # phase 02 runs on this slide...
  mode: "lip_neg"                    # ...and this mode
  calibrant_search_ppm: 50           # wide window to FIND each calibrant; the error is then measured
  calibrant_min_snr: 10
  ppm_floor: 2.0                     # suggested tolerances never go below this
  bin_ppm: 2.0                       # bin width for mean spectra of processed (non-continuous) data
  n_resolution_spectra: 20           # high-TIC single spectra used to measure peak widths
  tissue:
    signal: "nonmatrix_tic"          # nonmatrix_tic (TIC minus DAN ions) or tic
    threshold_method: "auto"         # auto | otsu | multiotsu | triangle (see tissue.py; auto fixes
                                     # holes when the raster hugs the tissue, as in lip_neg)
    smooth_sigma_px: 1.0
    min_object_px: 100
    close_radius_px: 2               # joins pieces of a section that got cut apart
    erode_edge_px: 3                 # pixels on the tissue edge are left out of statistics. Was 1;
                                     # bright rims at the section edges (slides E, F) showed up among
                                     # the top hits, so 3 px (150 um) are left out now
  sections:
    n_expected: 2
    # Which way the two sections are separated in the image: auto, rows (one above the other)
    # or cols (side by side). The real exports are 219 x 348 px, wider than tall: the slides
    # were imaged rotated, so the sections sit side by side ("auto" detects that).
    split_axis: auto
    # true: the section with the smaller row/column index (upper one, or LEFT one when side by
    # side) is the sample sheet's "Top" (= Control). false: the other way round.
    # CHECK sections_<slide>.png against Pilar's layout before trusting the statistics.
    top_is_low_index: true
    flip_slides: []                  # e.g. ["J"] if one slide turns out reversed
    manual_split: {}                 # e.g. {E: 170}: force the split at row/column 170 on slide E
  gradient:
    n_bins_y: 20
    flag_ratio: 2.0                  # 09 flags a hit if |log2FC| < flag_ratio x |gradient-predicted log2 ratio|

peaks:
  centroid: "auto"                   # auto | always | never. auto picks peaks only if spectra are profile
  snr: 5                             # peak SNR on the per-section mean spectrum
  noise_window: 401                  # points in the rolling-median noise estimate
  integration_fwhm_factor: 1.0       # profile data: integrate +- this x FWHM around each peak
  align_ppm: null                    # null means derived from 02/03 mass accuracy
  recalibrate_per_slide: true        # shift each slide by its median calibrant ppm error (from 03)
  min_section_fraction: 0.5          # keep a peak if it is picked in at least this fraction of sections
  min_pixel_fraction: 0.01           # and present (>0) in at least this fraction of tissue pixels of those sections
  max_peaks: 4000                    # safety cap, strongest peaks kept. Was 2000, which all three modes
                                     # hit; the untargeted test family is limited separately
                                     # (differential.untargeted_peaks), so more peaks don't dilute it
  # Peaks that are as strong on the bare glass as on the tissue are matrix (DAN clusters and
  # adducts the known-ion list misses). Ratio = off-tissue / on-tissue mean signal in the peak's
  # window, median over slides. Such peaks are moved out of the matrix like the DAN ions.
  # OFF: on the real data the off-tissue pixels sit right next to the tissue (the raster hugs
  # it), so delocalized tissue lipids (PI 38:4, PE 38:4, DHA, ...) scored 0.6-0.95 and 3,292 of
  # 4,000 lipid-negative peaks were removed, which also changed TIC normalization and broke the
  # registration of slide E Control. off_on_ratio is still computed and saved in
  # peaks_all_candidates.csv (and reported), so matrix-like peaks can be checked by hand.
  matrix_filter: {enabled: false, max_off_on_ratio: 1.5}

annotation:
  ppm_tolerance: null                # null means use the 02/03 suggestion, otherwise a number
  ppm_fallback: 10                   # only used if 02/03 can't measure it; QTOF-ish default
  adducts:
    negative: ["[M-H]-"]
    positive: ["[M+H]+", "[M+Na]+", "[M+K]+"]
    # extra adducts only for some classes; matches made with these are labelled as such
    class_specific:
      negative:
        GM1: ["[M-2H]2-"]
        GM2: ["[M-2H]2-"]
        GM3: ["[M-2H]2-"]
        GD1: ["[M-2H]2-"]
        GD2: ["[M-2H]2-"]
        GD3: ["[M-2H]2-"]
        GT1: ["[M-2H]2-"]
        CL: ["[M-2H]2-"]
        # choline lipids have no acidic proton: in negative mode they show up as [M-CH3]-
        # (and [M+Cl]-), never as [M-H]-. Note SM 36:1 [M-CH3]- has exactly the formula of
        # "SM 35:1 [M-H]-", so allowing [M-H]- here invents odd-chain SMs.
        PC: ["[M+Cl]-", "[M-CH3]-"]
        SM: ["[M+Cl]-", "[M-CH3]-"]
        LPC: ["[M+Cl]-", "[M-CH3]-"]
        LSM: ["[M+Cl]-", "[M-CH3]-"]
      positive:
        ST: ["[M+H-H2O]+"]
    # default adducts that a class can NOT form (chemistry), removed from the candidate list
    excluded:
      negative:
        PC: ["[M-H]-"]
        SM: ["[M-H]-"]
        LPC: ["[M-H]-"]
        LSM: ["[M-H]-"]
        CAR: ["[M-H]-"]                 # acylcarnitines are zwitterions; read them in positive mode
      positive:
        SHexCer: ["[M+H]+", "[M+Na]+", "[M+K]+"]   # sulfatides are anions; read them in negative mode
  lipidmaps_filter: true             # keep only compositions whose formula exists in the cached LMSD
  # Second pass for peaks still unnamed: match against every LIPID MAPS structure and every
  # SwissLipids species (both cached by 00_setup). Reaches classes the rules don't cover.
  # These names are untagged (never in the hypothesis families) and marked in annotation_source.
  second_pass: true
  metabolite_db: "hmdb"              # hmdb (cached in 00) or curated (reference/metabolites_curated.csv)
  max_candidates_reported: 5
  # Evidence that a named lipid exists in mouse brain, from the Lipid Brain Atlas paper
  # (Nature 2026, doi:10.1038/s41586-026-11050-0, CC BY 4.0), reference/lamanno2026/.
  # Scored as in the paper: LC-MS/MS 8, LC-MS 2, each published dataset 1, database only 0
  # (their METASPACE term left out). Gives evidence_score / confidence_tier (high = score > 4).
  # resolve_ambiguous: for a peak with several candidate compositions, all in classes their
  # quantitative whole-brain LC-MS/MS measures, report the one holding > molar_fraction of the
  # candidates' summed abundance (resolved_by = molar_fraction). Otherwise leave it as ranked.
  brain_evidence:
    enabled: true
    reference_dir: lamanno2026        # under reference/
    resolve_ambiguous: true
    molar_fraction: 0.8
    maldi_match_ppm: 5                # their MALDI peaks (positive mode) count only within this
    maldi_min_score: 4                # and only if they scored the name above this

normalization:
  methods: [tic, rms, median]
  for_stats: "tic"                   # decided up front; statistics only ever use this layer
  # Keep off. It needs its own environment, and as written it passes no covariate, so it would
  # align every section's intensity distributions and remove the genotype difference along
  # with the batch effects (each section is one animal here).
  umaia: {enabled: false, num_steps: 2000}
  embedding_batch_correction: "none" # none | harmony. Only for plots, never for statistics

registration:
  atlas_source: "brainglobe"         # brainglobe, or a path to an .npz atlas (the synthetic test uses that)
  atlas_name: "allen_mouse_25um"
  bregma_ccf_ap_mm: 5.40             # approximate AP position of bregma in CCF; CCF has no real bregma
  ap_search_bregma_mm: [-1.30, -2.50]
  ap_step_mm: 0.10
  try_rotations_deg: [0, 90, 180, 270]   # starting angles; slides were imaged rotated
  # No optical scans of slides E-K were in the share (they sit inside the SCiLS projects).
  # Don't use 09SEP26/Pilar_cerebellum_slide_Z001.tif: that's a different slide (cerebellum).
  # If Pilar exports them, put the paths here (relative to data_root) and the um per pixel.
  optical_tiffs: {E: null, F: null, G: null, I: null, J: null, K: null}
  tiff_um_per_px: null
  # Guide image per mode (used by the mode(s) that register themselves): auto = strongest
  # annotated sulfatide, else HexCer, else the first principal component. Or give an m/z.
  guide_ion: {lip_neg: auto, lip_pos: auto, met_neg: auto}
  # The three modes were exported on the SAME pixel grid per slide (identical pixel counts), so
  # register once, on the mode with the clearest white-matter marker (sulfatides, lip_neg), and
  # give the other modes the same per-pixel regions. 07 checks that the pixels really match
  # (>= 90%) and registers a mode on its own if they don't. null = register every mode separately.
  reuse_from: lip_neg
  bspline_grid_mm: 1.0
  bspline_iterations: 100
  min_dice: 0.80                     # sections below this fall back to lipid WM/GM masks only
  regions:                           # region name -> Allen acronyms (all descendants included)
    white_matter: ["fiber tracts"]
    corpus_callosum: ["ccb", "ccs"]
    cortex: ["Isocortex"]
    hippocampus: ["HPF"]
    thalamus: ["TH"]

explore:
  mode: null                         # null means every mode in modes.run
  # min_I 0.4 as in the Lipid Brain Atlas feature QC (was 0.3); a peak counts as spatially
  # structured if I >= min_I in at least min_section_fraction of the sections (6 of 12).
  morans_i: {k_neighbors: 6, n_perm: 199, min_I: 0.4, min_section_fraction: 0.5}   # smallest possible p = 1/(n_perm+1)
  nmf: {k: "auto", k_grid: [4, 6, 8, 10, 12], pixel_subsample: 50000, max_iter: 400}
  territories: {resolution: 0.5, k_neighbors: 15, pixel_subsample: 30000}   # Leiden; KMeans if leidenalg is missing
  # Divide each lipid by its per-slide median before NMF/territories, so the clustering follows
  # anatomy rather than slide-to-slide intensity differences (the slide effect is large here:
  # partial R2 ~0.93 in 06). Exploration only; statistics never use this.
  per_slide_scaling: true

differential:
  min_pixels_per_unit: 20
  # A lipid/region is only tested if at least this many slides have BOTH animals with enough
  # pixels there. With fewer pairs a t-test can give tiny p-values from 2 or 3 numbers
  # (it happened with territories that exist on only some slides).
  min_pairs: 5
  # The random-intercept model (statsmodels MixedLM) gave impossible p-values on the real data
  # (1e-20 and smaller next to t-test p of 1e-3): with 2 animals per slide its variance
  # estimate collapses. Off; the paired t-test is the analysis, Wilcoxon the sanity check.
  run_mixedlm: false
  fdr_alpha: 0.05
  run_territories: true
  # Which peaks enter the untargeted family (q_all):
  #   lamanno                 = the Lipid Brain Atlas feature QC: annotated (any database) AND
  #                             spatially structured in 08 (Moran's I) AND brighter on tissue than
  #                             on bare glass (off/on ratio < feature_qc.max_off_on_ratio) AND one
  #                             adduct per lipid (feature_qc). Peaks failing it are still tested
  #                             and reported, but get no q_all. Hypothesis-class peaks always keep
  #                             their own family (q_targeted), whatever the QC says.
  #   annotated_or_structured = annotated (not isotopes) or spatially structured (the old default)
  #   all                     = every non-isotope peak (strict FDR: mostly noise)
  untargeted_peaks: lamanno
  feature_qc:
    max_off_on_ratio: 1.0             # their rule: more signal on tissue than on the matrix
    # One adduct per lipid: when several ions carry the same name (e.g. [M+H]+, [M+Na]+, [M+K]+)
    # and their pixel intensities correlate (Pearson r of log intensities >= min_adduct_r), keep
    # the one with the fewest zero pixels, then the most signal. Ions that don't correlate are
    # all kept and flagged: one of them is probably a different compound.
    min_adduct_r: 0.5
    max_pixels_for_r: 50000
  # |log2FC| at or above this is flagged large_effect (a flag next to q, not a filter). The
  # Lipid Brain Atlas used 0.2 for its log fold changes; 0.2 in log2 is about 15%.
  large_effect_log2fc: 0.2
  # The lipid-only white/grey split (07 fallback) is unstable; use it only if no atlas
  # regions exist for this mode. "always" tests it anyway.
  lipid_wm_gm: fallback_only
  # Which test decides significance for single peaks: "moderated" (empirical-Bayes moderated
  # paired t, limma's approach: shares variance information across peaks, far more stable with
  # 5 degrees of freedom per peak) or "ttest" (the plain paired t). Both are always reported.
  single_peak_test: moderated
  # Also test every result after subtracting each slide's technical log2 ratio predicted from
  # the off-tissue position gradient (columns *_gradient_corrected). A sensitivity check.
  gradient_corrected: true
  # Class tests repeated with these normalizations (from the size factors 06 stores), as a check
  # that conclusions don't hinge on TIC. Statistics stay on normalization.for_stats.
  normalization_sensitivity: [median]
  # A section's atlas region share far from the other sections (outside these multiples of the
  # median) is reported as a possible registration problem.
  region_fraction_flag: [0.6, 1.67]
  # Sections to leave out of the atlas-region tests (whole section and territories keep them),
  # as "slide:Top" or "slide:Bottom". Only for a registration that is clearly off in the overlays.
  exclude_sections_from_regions: []
  # stats use log2 of the per-animal means; a pseudocount (half the smallest positive mean) is
  # added only for lipids where some animal's mean is exactly 0

# Class-level and ratio tests (run at the end of 09, from its per-animal means).
# For each animal and region the species of a class are added up, then tested with the same
# paired test as single peaks. Ratios are taken within the same animal and region, so TIC,
# matrix coating and most of a left/right trend cancel. One BH family per mode over all
# class and ratio tests. Set before looking at the genotype results; keep it that way.
# A class entry: classes = lipid_class values from 05, names = exact annotations,
# suffix = the annotation must end with it (";O3" = 2-hydroxylated). Entries missing in
# a mode's annotations are just skipped.
class_tests:
  enabled: true
  regions: [whole_section, white_matter, corpus_callosum, cortex, hippocampus, thalamus]
  min_sections: 10                   # a species must be seen in at least this many sections
  # which ambiguous peaks to leave out: tags = candidates with more than one hypothesis tag
  # (e.g. SHexCer vs BMP_PG); classes = candidates from more than one lipid class (strict,
  # drops many PC/PE and LPC/LPE overlaps); none = keep all
  ambiguity: tags
  classes:
    lip_neg:
      "Sulfatide": {classes: [SHexCer]}
      "Sulfatide 2-OH": {classes: [SHexCer], suffix: ";O3"}
      "Sulfatide non-OH": {classes: [SHexCer], suffix: ";O2"}
      "HexCer": {classes: [HexCer]}
      "Cer": {classes: [Cer]}
      "SM": {classes: [SM]}
      "LSM": {classes: [LSM]}             # lyso-sphingomyelin: reported to accumulate (Ballabio lab data)
      "GM1": {classes: [GM1]}
      "GM2": {classes: [GM2]}
      "GM3": {classes: [GM3]}
      "GM2+GM3": {classes: [GM2, GM3]}
      "GM all": {classes: [GM1, GM2, GM3]}
      "BMP/PG": {classes: [BMP/PG]}
      "BMP/PG 44:12": {names: ["BMP/PG 44:12"]}
      "PE": {classes: [PE]}
      "PI": {classes: [PI]}
      "PS": {classes: [PS]}
      "PE+PI+PS": {classes: [PE, PI, PS]}
      "LPE": {classes: [LPE]}
      "LPI": {classes: [LPI]}
    lip_pos:
      "HexCer": {classes: [HexCer]}
      "Hex2Cer": {classes: [Hex2Cer]}    # dihexosylceramide; in brain mostly LacCer
      "SM": {classes: [SM]}
      "LSM": {classes: [LSM]}
      "PC": {classes: [PC]}
      "PE": {classes: [PE]}
      "Cholesterol": {classes: [Cholesterol]}
      "LPC": {classes: [LPC]}
    met_neg:
      "GPD sum": {classes: [Glycerophosphodiester]}
      "GPI": {names: [Glycerophosphoinositol]}
      "GPE": {names: [Glycerophosphoethanolamine]}
      "GPG": {names: [Glycerophosphoglycerol]}
      "Glycerol 3-phosphate": {names: ["Glycerol 3-phosphate"]}
      "N-acetylaspartate": {names: [N-acetylaspartate]}
      "NAAG": {names: [N-acetylaspartylglutamate]}
      "Phosphoethanolamine": {names: [Phosphoethanolamine]}
      "Taurine": {names: [Taurine]}
      "Glutamate": {names: [Glutamate]}
      "GABA": {names: [GABA]}
      "LPE": {classes: [LPE]}
      "LPI": {classes: [LPI]}
      "LSM": {classes: [LSM]}
  ratios:                            # [numerator, denominator], names from the classes above
    lip_neg:
      - ["Sulfatide", "HexCer"]
      - ["Sulfatide 2-OH", "Sulfatide non-OH"]
      - ["Sulfatide", "PE+PI+PS"]
      - ["HexCer", "Cer"]
      - ["SM", "Cer"]
      - ["LSM", "SM"]
      - ["GM2+GM3", "GM1"]
      - ["GM3", "GM1"]
      - ["BMP/PG", "PE+PI+PS"]
      - ["BMP/PG 44:12", "PE+PI+PS"]
      - ["LPE", "PE"]
      - ["LPI", "PI"]
    lip_pos:
      - ["HexCer", "PC"]
      - ["HexCer", "SM"]
      - ["LPC", "PC"]
      - ["LSM", "SM"]
      - ["Hex2Cer", "HexCer"]
    met_neg:
      - ["GPE", "LPE"]
      - ["GPI", "LPI"]
      - ["GPE", "Phosphoethanolamine"]
      - ["GPD sum", "N-acetylaspartate"]
  # Precursor -> product ratios for sphingolipid steps that keep the ceramide backbone (same
  # chains), one ratio per backbone we detect, e.g. HexCer 42:2;O2 / Cer 42:2;O2. In a KO vs
  # Control comparison of log ratios the lipids' different ionization efficiencies cancel, so
  # these index one enzyme step each. Lyso/diacyl phospholipid steps are left out on purpose:
  # one sum composition maps to many lyso species, and MALDI in-source fragments of PC look
  # like LPC. Exploratory; their own BH family per mode (reaction_tests.csv).
  reactions:
    regions: [whole_section, white_matter]
    steps:
      - {product: HexCer, precursor: Cer, enzyme: "Ugt8 (GalCer synthase) / Ugcg"}
      - {product: SHexCer, precursor: HexCer, enzyme: "Gal3st1 (cerebroside sulfotransferase)"}
      - {product: Hex2Cer, precursor: HexCer, enzyme: "B4galt5/6 (LacCer synthase)"}
      - {product: SM, precursor: Cer, enzyme: "Sgms1/2 (SM synthase)"}
  # Primary endpoints: a short list named in advance from the hypotheses (myelin lipids in white
  # matter; storage lipids and BMP across the section; glycerophosphodiesters from the CLN3
  # literature). They get their own BH family (q_primary), the one with real power at n = 6.
  # Format "region | class or ratio name". Everything else stays exploratory.
  primary:
    lip_neg:
      - "white_matter | Sulfatide / PE+PI+PS"
      - "white_matter | HexCer"
      - "whole_section | Cer"
      - "whole_section | GM all"
      - "whole_section | BMP/PG"
    lip_pos: []
    met_neg:
      - "whole_section | GPI"
      - "whole_section | GPG"
      - "whole_section | GPE"
  # features shown in the per-slide dot plot (class or ratio names, per mode)
  plot_features:
    lip_neg: ["Sulfatide", "Sulfatide / PE+PI+PS", "HexCer", "Cer", "GM all", "BMP/PG"]
    lip_pos: ["HexCer", "HexCer / PC", "SM", "LPC / PC"]
    met_neg: ["GPI", "GPG", "GPE", "GPI / LPI"]

# Do the slides agree? (end of 09) Each slide's log2(Mutant/Control) over all tested peaks is
# its "difference profile". With correct labels the slides share the genotype effect, so the
# profiles correlate positively, or at least not negatively. A slide whose profile is the
# mirror image of the others may have its two sections swapped. This is only a warning:
# never relabel a slide because of it. Check the sectioning/mounting records, and only if
# they confirm a swap, list the slide in qc.sections.flip_slides and rerun from 03.
pair_check:
  enabled: true
  units: [whole_section, white_matter, cortex]
  flag_below: -0.3                   # flag a slide whose median correlation with the others is below this
  min_peaks: 20                      # fewer tested peaks than this: correlations too noisy, check skipped
  # redo the class tests with flagged slides left out and flipped, as extra columns
  # (exploratory: choosing the analysis after seeing the data is circular)
  sensitivity: true

hypotheses:                          # direction expected in CLN3 KO vs Control
  accumulated: [LSM, Cer, HexCer, Hex2Cer, GM1, GM2, GM3, SM, SHexCer]
  depleted: [SM, SHexCer]            # specific myelin species; SM and SHexCer appear in both lists on purpose
  secondary: [BMP_PG, GPD, ST]

# Comparison with the SCiLS exports in the data folder. Off for the preliminary analysis.
scils_crosscheck:
  enabled: false
  files:                             # relative to data_root
    lip_neg: "export_All_Lip_Neg.xlsx"
    lip_pos: "export_All_Lip_Pos..csv"
    met_neg: "export_All_Met_Neg.csv"
  match_ppm: 10
  preview_rows: 20

downloads:                           # only used by 00_setup.py --download
  lipidmaps_url: "https://www.lipidmaps.org/files/?file=LMSD&ext=sdf.zip"
  hmdb_url: "https://hmdb.ca/system/downloads/current/structures.zip"
  swisslipids_url: "https://www.swisslipids.org/api/file.php?cas=download_files&file=lipids.tsv"
  timeout_s: 600

report:
  top_n_hits: 12
  cmap: "viridis"
