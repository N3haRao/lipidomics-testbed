# Config for the HPC (Ada). Inherits everything from config.yaml and only moves the folders.
# The job scripts in bin/hpc/ set both variables from bin/hpc/settings.sh:
#   CLN3_WORK = HPC_WORK (default ~/cln3_msi), your own work folder
#   CLN3_DATA = HPC_DATA (default HPC_WORK/data), the folder with "imzML files for biostats".
#               It can be someone else's folder: the pipeline only reads it.
#
#   ${CLN3_DATA}/imzML files for biostats/...   <- uploaded from the Mac by upload_to_hpc.sh
#   ${CLN3_WORK}/outputs/                       <- everything the pipeline writes
inherit: config.yaml

paths:
  data_root: "${CLN3_DATA}"
  output_root: "${CLN3_WORK}/outputs"
