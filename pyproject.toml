[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cln3msi"
version = "0.1.0"
description = "MALDI-MSI lipidomics pipeline for the CLN3 KO brain project (helper package used by scripts/)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
