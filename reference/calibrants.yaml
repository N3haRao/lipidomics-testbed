# Ions used in QC. All m/z values are computed from these formulas in chem.py, never typed in.
#
# matrix: candidate DAN (1,5-diaminonaphthalene) ions. The matrix formula itself comes from
#   acquisition.matrix_formula in config.yaml. Not every one of these will show up, phase 02
#   reports which ones it actually finds.
# mass_accuracy: confident, abundant brain species used to estimate mass error.
#   Picked because they are among the strongest MALDI signals in mouse brain in that polarity.

matrix:
  negative: ["[M-H]-", "[2M-H]-", "[2M-3H]-", "[3M-H]-", "[4M-H]-"]
  positive: ["[M]+", "[M+H]+", "[2M+H]+", "[2M]+", "[3M+H]+", "[4M+H]+"]

mass_accuracy:
  lipid:
    negative:
      - {name: "PI 38:4",          formula: "C47H83O13P",  adduct: "[M-H]-"}
      - {name: "PE 40:6",          formula: "C45H78NO8P",  adduct: "[M-H]-"}
      - {name: "PE 38:4",          formula: "C43H78NO8P",  adduct: "[M-H]-"}
      - {name: "PS 40:6",          formula: "C46H78NO10P", adduct: "[M-H]-"}
      - {name: "SHexCer 42:2;O2",  formula: "C48H91NO11S", adduct: "[M-H]-"}
      - {name: "SHexCer 42:1;O2",  formula: "C48H93NO11S", adduct: "[M-H]-"}
      - {name: "SHexCer 42:2;O3",  formula: "C48H91NO12S", adduct: "[M-H]-"}
      - {name: "PE O-38:5",        formula: "C43H78NO7P",  adduct: "[M-H]-"}
      - {name: "FA 22:6",          formula: "C22H32O2",    adduct: "[M-H]-"}
    positive:
      - {name: "PC 34:1",          formula: "C42H82NO8P",  adduct: "[M+H]+"}
      - {name: "PC 34:1",          formula: "C42H82NO8P",  adduct: "[M+Na]+"}
      - {name: "PC 34:1",          formula: "C42H82NO8P",  adduct: "[M+K]+"}
      - {name: "PC 32:0",          formula: "C40H80NO8P",  adduct: "[M+K]+"}
      - {name: "PC 36:1",          formula: "C44H86NO8P",  adduct: "[M+K]+"}
      - {name: "PC 38:6",          formula: "C46H80NO8P",  adduct: "[M+K]+"}
      - {name: "SM 36:1;O2",       formula: "C41H83N2O6P", adduct: "[M+H]+"}
      - {name: "HexCer 42:2;O2",   formula: "C48H91NO8",   adduct: "[M+Na]+"}
  metabolite:
    negative:
      - {name: "Taurine",           formula: "C2H7NO3S",     adduct: "[M-H]-"}
      - {name: "Glutamate",         formula: "C5H9NO4",      adduct: "[M-H]-"}
      - {name: "Aspartate",         formula: "C4H7NO4",      adduct: "[M-H]-"}
      - {name: "N-acetylaspartate", formula: "C6H9NO5",      adduct: "[M-H]-"}
      - {name: "Glutathione",       formula: "C10H17N3O6S",  adduct: "[M-H]-"}
      - {name: "AMP",               formula: "C10H14N5O7P",  adduct: "[M-H]-"}
      - {name: "ADP",               formula: "C10H15N5O10P2", adduct: "[M-H]-"}
      - {name: "Cholesterol sulfate", formula: "C27H46O4S",  adduct: "[M-H]-"}
      - {name: "FA 22:6",           formula: "C22H32O2",     adduct: "[M-H]-"}
